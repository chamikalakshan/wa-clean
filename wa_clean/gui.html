<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wa-clean</title>
<style>
:root {
  --bg: #f5f6f4; --panel: #ffffff; --text: #1c1f1d; --muted: #6b726e;
  --line: #e2e5e2; --accent: #128c5e; --accent-soft: #e3f3ec;
  --danger: #c4372b; --danger-soft: #fbe9e7; --warn-soft: #fff4d6; --warn: #8a6100;
  --chip: #eef0ee; --bar: #cfe9dd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121413; --panel: #1b1e1c; --text: #e8ebe9; --muted: #98a09b;
    --line: #2c312e; --accent: #3cc48c; --accent-soft: #1d3329;
    --danger: #ff7a6b; --danger-soft: #3a2220; --warn-soft: #3a3016; --warn: #f0c35a;
    --chip: #262a27; --bar: #275a43;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button { font: inherit; cursor: pointer; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; }
.stats { color: var(--muted); flex: 1; }
.stats b { color: var(--text); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 6px 12px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.banner { background: var(--warn-soft); color: var(--warn); padding: 9px 20px;
  border-bottom: 1px solid var(--line); }
.banner.danger { background: var(--danger-soft); color: var(--danger); }
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 120px); }
aside { border-right: 1px solid var(--line); background: var(--panel); padding: 16px;
  display: flex; flex-direction: column; gap: 18px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--text);
  border-radius: 999px; padding: 4px 11px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { margin-top: 3px; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 12px; }
.chatbox { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chatbox input[type=search] { width: 100%; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.chatlist { overflow-y: auto; max-height: 340px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
.chatrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.chatrow:last-child { border-bottom: 0; }
.chatrow:hover { background: var(--bg); }
.chatrow input { accent-color: var(--accent); }
.chatrow .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatrow .s { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chathead { display: flex; justify-content: space-between; align-items: baseline; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px; }
main { padding: 20px 24px 100px; min-width: 0; }
.summary { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.bars { display: grid; gap: 6px; margin-bottom: 22px; max-width: 720px; }
.bar { display: grid; grid-template-columns: 200px 1fr 80px; gap: 10px; align-items: center; font-size: 13px; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.thumb { aspect-ratio: 1; background: var(--chip); display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; position: relative; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 4px; text-transform: none; letter-spacing: 0; }
.meta { padding: 7px 9px; font-size: 12px; }
.meta .sz { font-weight: 600; font-size: 13px; }
.meta .c { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.footer .msg { flex: 1; color: var(--muted); }
.center { padding: 80px 20px; text-align: center; color: var(--muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; padding: 22px; max-width: 520px; width: 100%; }
.modal h3 { margin: 0 0 10px; font-size: 18px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.ok { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
.err { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
code { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  font-size: 12px; word-break: break-all; margin-top: 6px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .bar { grid-template-columns: 110px 1fr 64px; }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>wa-clean <span class="hint" style="font-weight:400">media cleaner for WhatsApp</span></h1>
  <div class="stats" id="stats">Scanning…</div>
  <button class="btn" id="rescan" disabled>Rescan</button>
</header>
<div class="banner" id="running" hidden>
  WhatsApp is open. You can look around, but quit WhatsApp (⌘Q) and press Rescan before moving anything.
</div>
<div class="banner danger" id="problems" hidden></div>

<div class="layout">
  <aside>
    <section>
      <label class="toggle">
        <input type="checkbox" id="unlinked" checked>
        <span><b>Only unlinked copies</b><br>
          <span class="hint">Files no message points to. WhatsApp can't show them, so removing them changes nothing in your chats.</span></span>
      </label>
    </section>
    <section>
      <h2>Type</h2>
      <div class="chips" id="types"></div>
    </section>
    <section>
      <h2>Older than</h2>
      <div class="chips" id="age"></div>
    </section>
    <section>
      <h2>Larger than</h2>
      <div class="chips" id="size"></div>
    </section>
    <section>
      <label class="toggle">
        <input type="checkbox" id="starred" checked>
        <span>Keep media from starred messages</span>
      </label>
    </section>
    <section class="chatbox">
      <div class="chathead"><h2>Chats</h2><button class="link" id="clearChats" hidden>Clear</button></div>
      <input type="search" id="chatSearch" placeholder="Search chats">
      <div class="hint" id="chatHint" style="margin-top:6px">All chats</div>
      <div class="chatlist" id="chatList"></div>
    </section>
  </aside>

  <main id="main">
    <div class="center"><div class="spinner"></div>Scanning WhatsApp media. This takes about 40 seconds.</div>
  </main>
</div>

<div class="footer">
  <div class="msg" id="footMsg">Nothing selected yet.</div>
  <button class="btn primary" id="trashBtn" disabled>Move to Trash</button>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
const TOKEN = "__TOKEN__";
const TYPES = [["photo","Photos"],["video","Videos"],["sticker","Stickers"],["audio","Audio"],
               ["document","Documents"],["thumbnail","Thumbnails"],["other","Other"]];
const AGES = [[0,"Any"],[30,"1 month"],[90,"3 months"],[180,"6 months"],[365,"1 year"]];
const SIZES = [[0,"Any"],[1e6,"1 MB"],[1e7,"10 MB"],[5e7,"50 MB"],[1e8,"100 MB"]];

const state = { types: new Set(), age: 0, size: 0, chats: new Set(), allChats: [],
                running: false, unsafe: false, preview: null, seq: 0 };
const $ = id => document.getElementById(id);

function human(n) {
  for (const u of ["B","KB","MB","GB"]) {
    if (Math.abs(n) < 1000) return u === "B" ? `${n} B` : `${n.toFixed(1)} ${u}`;
    n /= 1000;
  }
  return `${n.toFixed(1)} TB`;
}
const num = n => n.toLocaleString();
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path, body) {
  const r = await fetch(path, { method: "POST", body: JSON.stringify(body || {}),
    headers: { "Content-Type": "application/json", "X-Token": TOKEN } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function chipGroup(el, options, isOn, onClick) {
  el.innerHTML = "";
  for (const [value, label] of options) {
    const b = document.createElement("button");
    b.className = "chip" + (isOn(value) ? " on" : "");
    b.textContent = label;
    b.onclick = () => { onClick(value); renderFilters(); refreshPreview(); };
    el.appendChild(b);
  }
}

function renderFilters() {
  chipGroup($("types"), TYPES, v => state.types.has(v),
    v => state.types.has(v) ? state.types.delete(v) : state.types.add(v));
  chipGroup($("age"), AGES, v => state.age === v, v => state.age = v);
  chipGroup($("size"), SIZES, v => state.size === v, v => state.size = v);
}

function renderChats() {
  const q = $("chatSearch").value.trim().toLowerCase();
  const sizeKey = $("unlinked").checked ? "unlinked" : "total";
  const rows = state.allChats
    .filter(c => !q || c.name.toLowerCase().includes(q) || state.chats.has(c.jid))
    .filter(c => c[sizeKey] > 0 || state.chats.has(c.jid))
    .sort((a, b) => b[sizeKey] - a[sizeKey])
    .slice(0, 200);
  $("chatList").innerHTML = rows.map(c => `
    <label class="chatrow">
      <input type="checkbox" data-jid="${esc(c.jid)}" ${state.chats.has(c.jid) ? "checked" : ""}>
      <span class="n" title="${esc(c.name)}">${esc(c.name)}</span>
      <span class="s">${human(c[sizeKey])}</span>
    </label>`).join("") || `<div class="chatrow hint">No chats match.</div>`;
  const n = state.chats.size;
  $("chatHint").textContent = n ? `${n} chat${n > 1 ? "s" : ""} selected` : "All chats";
  $("clearChats").hidden = !n;
}

$("chatList").addEventListener("change", e => {
  const jid = e.target.dataset.jid;
  if (!jid) return;
  e.target.checked ? state.chats.add(jid) : state.chats.delete(jid);
  renderChats(); refreshPreview();
});
$("chatSearch").addEventListener("input", renderChats);
$("clearChats").onclick = () => { state.chats.clear(); renderChats(); refreshPreview(); };
$("unlinked").onchange = () => { renderChats(); refreshPreview(); };
$("starred").onchange = refreshPreview;

function filters() {
  return { types: [...state.types], chats: [...state.chats],
           older_than_days: state.age || null, larger_than: state.size || null,
           unlinked: $("unlinked").checked, include_starred: !$("starred").checked };
}

async function scan(refresh) {
  $("rescan").disabled = true;
  $("trashBtn").disabled = true;
  $("stats").textContent = "Scanning…";
  if (refresh) $("main").innerHTML = `<div class="center"><div class="spinner"></div>Scanning WhatsApp media. This takes about 40 seconds.</div>`;
  try {
    const d = await api("/api/scan", { refresh });
    state.allChats = d.chats;
    state.running = d.running;
    $("running").hidden = !d.running;
    state.unsafe = d.problems.length > 0;
    $("problems").hidden = !state.unsafe;
    $("problems").textContent = "⚠️ " + d.problems.join(" ") +
      " You can look around, but moving files is turned off.";
    $("stats").innerHTML = `<b>${human(d.total)}</b> in ${num(d.files)} files · <b>${human(d.unlinked)}</b> unlinked · ${num(d.chats.length)} chats`;
    renderChats();
    await refreshPreview();
  } catch (e) {
    $("main").innerHTML = `<div class="err">Scan failed: ${esc(e.message)}</div>`;
  } finally {
    $("rescan").disabled = false;
  }
}
$("rescan").onclick = () => scan(true);

async function refreshPreview() {
  if (!state.allChats.length) return;
  const seq = ++state.seq;
  $("footMsg").textContent = "Updating…";
  let p;
  try { p = await api("/api/preview", filters()); }
  catch (e) { $("footMsg").textContent = "Preview failed: " + e.message; return; }
  if (seq !== state.seq) return;  // a newer request is on its way
  state.preview = p;
  renderPreview(p);
}

function renderPreview(p) {
  const max = p.chats.length ? p.chats[0].size : 1;
  const bars = p.chats.map(c => `
    <div class="bar"><span class="n" title="${esc(c.name)}">${esc(c.name)}</span>
      <span class="track"><span class="fill" style="display:block;width:${Math.max(1, c.size / max * 100)}%"></span></span>
      <span class="v">${human(c.size)}</span></div>`).join("");
  const cards = p.files.map(f => `
    <div class="card">
      <div class="thumb">
        ${f.kind}
        ${f.thumb ? `<img loading="lazy" src="/file?i=${f.i}&t=${TOKEN}" alt="" onerror="this.remove()">` : ""}
        ${f.linked ? "" : `<span class="tag">unlinked</span>`}
      </div>
      <div class="meta"><div class="sz">${human(f.size)}</div>
        <div class="c" title="${esc(f.chat)}">${esc(f.chat)}</div>
        <div class="c">${f.date}</div></div>
    </div>`).join("");
  $("main").innerHTML = p.count ? `
    <div class="summary"><span class="big">${human(p.size)}</span>
      <span class="hint">${num(p.count)} files match</span></div>
    <h2>By chat</h2><div class="bars">${bars}</div>
    ${p.more_chats ? `<p class="hint" style="margin-top:-12px">and ${num(p.more_chats)} more chats</p>` : ""}
    <h2>Largest files</h2><div class="grid">${cards}</div>`
    : `<div class="center">No files match these filters.</div>`;
  $("footMsg").innerHTML = p.count
    ? `Selected <b>${num(p.count)}</b> files, <b>${human(p.size)}</b>`
    : "Nothing matches.";
  $("trashBtn").disabled = !p.count || state.running || state.unsafe;
  $("trashBtn").title = state.unsafe ? "Turned off: see the warning at the top"
    : state.running ? "Quit WhatsApp and press Rescan first" : "";
}

function modal(html) { $("modal").innerHTML = html; $("overlay").hidden = false; }
function closeModal() { $("overlay").hidden = true; }

$("trashBtn").onclick = () => {
  const p = state.preview;
  modal(`<h3>Move ${num(p.count)} files to the Trash?</h3>
    <p>That's ${human(p.size)}. They go into one "WhatsApp Cleanup" folder in the Trash.
    Your chats and messages aren't touched.</p>
    <p class="hint">Changed your mind later? Use Put Back in Finder, and the app shows a command to restore them.</p>
    <div class="actions"><button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mGo">Move to Trash</button></div>`);
  $("mCancel").onclick = closeModal;
  $("mGo").onclick = doTrash;
};

async function doTrash() {
  const p = state.preview;
  modal(`<div class="center" style="padding:30px"><div class="spinner"></div>Moving ${num(p.count)} files…</div>`);
  let r;
  try { r = await api("/api/trash", { ...filters(), expect_count: p.count }); }
  catch (e) { r = { error: e.message }; }
  if (r.error) {
    modal(`<div class="err">${esc(r.error)}</div>
      <div class="actions"><button class="btn" id="mClose">Close</button></div>`);
  } else {
    const where = r.trashed
      ? `The folder <b>${esc(r.stage.split("/").pop())}</b> is in the Trash. Empty the Trash to free the space.`
      : `Couldn't put the folder in the Trash. The files are in <code>${esc(r.stage)}</code>Drag it to the Trash yourself.`;
    modal(`<div class="ok"><b>Moved ${num(r.moved)} files (${human(r.freed)}).</b>
      ${r.failed ? `<br>${num(r.failed)} files couldn't be moved.` : ""}</div>
      <p>${where}</p>
      <p class="hint">To undo: Put Back in Finder, quit WhatsApp, then run in Terminal:</p>
      <code id="restoreCmd">${esc(r.restore)}</code>
      <div class="actions"><button class="btn" id="mCopy">Copy command</button>
        <button class="btn" id="mClose">Done</button></div>`);
    $("mCopy").onclick = () => navigator.clipboard.writeText(r.restore)
      .then(() => $("mCopy").textContent = "Copied");
  }
  $("mClose").onclick = () => { closeModal(); scan(false); };
}

renderFilters();
scan(false);
</script>
</body>
</html>
