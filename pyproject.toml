[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-clean"
version = "0.1.0"
description = "Find and safely remove WhatsApp media on macOS without losing your chats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Chamikalakshan22" }]
keywords = ["whatsapp", "macos", "disk-space", "cleanup", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/wa-clean"
Issues = "https://github.com/YOUR-USERNAME/wa-clean/issues"

[project.scripts]
wa-clean = "wa_clean.cli:main"

[tool.setuptools]
packages = ["wa_clean"]

[tool.setuptools.package-data]
wa_clean = ["gui.html"]
